<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wanderlust | Travel Agency</title>
  <meta name="description" content="Find your next adventure with Wanderlust. Explore pristine beaches, towering mountains and vibrant cities.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--
    ============================================================
    SITE DETAILS - change the values here, then update the same
    text further down the page (search for the old value).
      Brand name ........ Wanderlust
      Company name ...... Wanderlust Travel Agency
      Copyright year .... 2024
    ============================================================
  -->

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="#home">Wanderlust</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <img src="assets/images/icons/menu.svg" width="23" height="15" alt="">
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul class="site-nav__list">
          <li><a class="site-nav__link is-active" href="#home" data-spy="home">Home</a></li>
          <li><a class="site-nav__link" href="#about" data-spy="about">About</a></li>
          <li><a class="site-nav__link" href="#destinations" data-spy="destinations">Destinations</a></li>
        </ul>
        <a class="btn btn--small" href="#destinations">Book Now</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="home" aria-labelledby="hero-title">
      <img class="hero__bg" src="assets/images/hero/hero-beach.jpg" width="512" height="286" alt="Wooden outrigger boat on a white sand beach at sunset">
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title" id="hero-title">WELCOME TO DREAM TRAVEL</h1>
        <p class="hero__text">Find your next adventure here. Explore pristine beaches, towering mountains, and vibrant cities with our curated travel experiences.</p>
        <a class="btn btn--large" href="#destinations">
          Book Now
          <img src="assets/images/icons/arrow-right.svg" width="16" height="16" alt="">
        </a>
      </div>
    </section>

    <!-- destinations -->
    <!-- about -->
  </main>
  <!-- footer -->

  <script src="js/main.js"></script>
</body>
</html>
